# Template repo only: prove rename + drop leave a working project. `make rename` deletes this file.
name: template
on: [push, pull_request]
jobs:
  rename-and-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: make rename NAME=demo-tool && make drop-dashboard drop-docker && make sync lint test docs-build
      - run: "! git grep -n -e project_template -e project-template -e '>>> [a-z]*$'"
