name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make sync lint test docs-build
# >>> dashboard
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: make frontend
# <<< dashboard

