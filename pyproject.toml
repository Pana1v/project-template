[project]
name = "project-template"
version = "0.1.0"
description = "Starting point for a new project: CLI, docs, agent docs, optional dashboard and Docker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
# >>> dashboard
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# <<< dashboard

[project.scripts]
project-template = "project_template.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2"]  # httpx2: starlette TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import dashboard/

[tool.ruff]
line-length = 110
