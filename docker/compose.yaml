services:
  app:
    build: {context: .., dockerfile: docker/Dockerfile}
    image: project-template
    command: ["demo"]
    user: "${UID:-1000}:${GID:-1000}"  # logs/ on the host stays yours, not root's
    volumes: ["../logs:/app/logs"]
# >>> dashboard
  dashboard:
    image: project-template
    depends_on: [app]
    entrypoint: ["python", "-m", "dashboard.backend", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8080:8080"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["../logs:/app/logs"]
# <<< dashboard
